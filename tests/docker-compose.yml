services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U testuser -d testdb"
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  backup:
    build:
      context: ..
      dockerfile: Dockerfile

    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: testdb
      PGUSER: testuser
      PGPASSWORD: testpassword

      BACKUP_DIR: /backups

      # We invoke backup manually during tests.
      BACKUP_ON_START: "false"
      BACKUP_ON_SHUTDOWN: "false"

      BACKUP_INTERVAL_SECONDS: 86400
      BACKUP_RETENTION_DAYS: 14
      BACKUP_COMPRESSION: 6

    volumes:
      - ./backups:/backups

    depends_on:
      postgres:
        condition: service_healthy
